name: CI

# The portfolio is static HTML plus one critical non-code artefact: the nginx
# vhost embedded in deploy.sh. That vhost has been silently truncated twice in
# this repository's history (a parallel deploy wrote a stale copy over it, taking
# `root`, gzip and the /assets/ caching with it), and nothing caught either time.
# So CI's main job is to refuse a deploy.sh that has lost a block.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The nginx vhost is generated from a heredoc inside deploy.sh. Assert that
      # every block that has ever been lost is still there, that braces balance,
      # that no duplicate exact-match location exists (nginx refuses to load the
      # whole config when it does), and that the sitemap points at real files.
      - name: nginx config guard
        run: python3 scripts/check-deploy-config.py

      # A guard that cannot fail is worthless, so break the config in each of
      # the ways it has been broken before and assert the guard notices.
      - name: nginx config guard self-test
        run: python3 scripts/test-deploy-guard.py

      # Internal links only; external ones are not fetched on purpose, so CI
      # cannot go red because someone else's site is down.
      - name: internal links
        run: python3 scripts/check_links.py
