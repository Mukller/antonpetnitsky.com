<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server error — Anton Petnitsky</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Server error. Please try again later.">
  <link rel="icon" href="/ap-favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    :root {
      --bg:        #0d1117;
      --bg-card:   #161b22;
      --border:    #21262d;
      --text:      #c9d1d9;
      --muted:     #8b949e;
      --bright:    #e6edf3;
      --accent:    #58a6ff;
      --accent-light: #79c0ff;
      --green:     #3fb950;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .error-wrap { max-width: 520px; width: 100%; text-align: center; }

    .error-code {
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
      color: var(--bright);
      user-select: none;
    }
    .error-code span { color: var(--accent); }

    .error-icon {
      margin: 24px auto 20px;
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .error-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--bright);
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }

    .error-desc {
      color: var(--muted);
      font-size: 15px;
      max-width: 400px;
      margin: 0 auto 8px;
    }

    .error-status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .error-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .2s ease;
      text-decoration: none;
    }
    .btn-primary { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }
    .btn-primary:hover { filter: brightness(.92); text-decoration: none; }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { background: rgba(88, 166, 255, 0.1); border-color: var(--accent); color: var(--accent-light); text-decoration: none; }

    @media (max-width: 480px) {
      .error-code { font-size: 72px; letter-spacing: -3px; }
    }
  </style>
</head>
<body>
<main class="error-wrap">
  <div class="error-code">5<span>0</span>x</div>

  <div class="error-icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/><path d="M12 8v4"/><circle cx="12" cy="15.5" r=".9" fill="currentColor" stroke="none"/></svg>
  </div>

  <h1 class="error-title" data-en="Something broke on the server" data-ru="На сервере что-то сломалось">Something broke on the server</h1>
  <p class="error-desc" data-en="The robot is already fixing it. Usually this passes in a few minutes." data-ru="Робот уже чинит. Обычно это проходит за пару минут.">The robot is already fixing it. Usually this passes in a few minutes.</p>
  <div class="error-status">HTTP 500 · 502 · 503 · 504</div>

  <div class="error-actions">
    <button class="btn btn-primary" type="button" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span data-en="Try again" data-ru="Попробовать снова">Try again</span>
    </button>
    <a class="btn btn-ghost" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>
      <span data-en="Back home" data-ru="На главную">Back home</span>
    </a>
  </div>
</main>

<script>
  (function () {
    var l = localStorage.getItem('ap_lang') ||
            (navigator.language && navigator.language.indexOf('ru') === 0 ? 'ru' : 'en');
    document.querySelectorAll('[data-' + l + ']').forEach(function (el) {
      var val = el.getAttribute('data-' + l);
      if (val) el.innerHTML = val;
    });
    document.documentElement.lang = l;
  })();
</script>
</body>
</html>
